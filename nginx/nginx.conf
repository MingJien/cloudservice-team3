worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Cloudflare terminates TLS before forwarding to the local tunnel, so Nginx
    # receives HTTP while the browser's real origin is HTTPS. Preserve the
    # trusted upstream protocol when present; fall back to the local scheme for
    # ordinary localhost/VPS requests. This keeps Next.js' CSRF same-origin
    # gate strict without falsely rejecting every Quick-Tunnel login.
    map $http_x_forwarded_proto $cloudservice_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    sendfile        on;
    keepalive_timeout  65;

    # Cấu hình chặn hiển thị version Nginx (bảo mật)
    server_tokens off;

    server {
        listen       80;
        server_name  localhost;

        # Next.js BFF endpoints must stay on the frontend. They own the
        # HttpOnly session/affiliate cookies and then call ASP.NET internally.
        # If this block is omitted, the generic /api/ proxy below sends these
        # routes to ASP.NET (which correctly returns 404 because it exposes
        # /api/auth, /api/order-requests, ... instead).
        location ^~ /api/session/ {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $cloudservice_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        location ^~ /api/orders {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $cloudservice_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        location ^~ /api/affiliate/ {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $cloudservice_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        location ^~ /api/admin/ {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $cloudservice_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        location ^~ /api/backend/ {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $host;
            proxy_set_header   X-Forwarded-Proto $cloudservice_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        # Runtime uploads are owned by ASP.NET StaticFiles, while editorial
        # /images/ are baked into Next.js. Exposing these explicit paths lets
        # the browser use the same-origin /api base even after a Quick Tunnel
        # changes host name, without accidentally proxying every frontend file.
        location ^~ /uploads/ {
            proxy_pass         http://api:8080/uploads/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ^~ /avatars/ {
            proxy_pass         http://api:8080/avatars/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ^~ /branding/ {
            proxy_pass         http://api:8080/branding/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ^~ /plan-images/ {
            proxy_pass         http://api:8080/plan-images/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # The remaining /api/ routes are public/direct ASP.NET endpoints.
        location /api/ {
            proxy_pass         http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Readiness is an API endpoint outside the /api prefix. Keep it on the
        # backend so Docker/VPS smoke checks do not accidentally receive Next.js 404.
        location = /health/ready {
            proxy_pass         http://api:8080/health/ready;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Chuyển hướng Swagger UI (nếu cần xem API Docs trên production)
        location /swagger/ {
            proxy_pass         http://api:8080/swagger/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # Tất cả các request còn lại sẽ đẩy về Frontend (Next.js)
        location / {
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
