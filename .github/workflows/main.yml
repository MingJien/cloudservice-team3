name: CloudService release gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend:
    name: .NET 10 build, unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/CloudService.sln
      - run: dotnet build backend/CloudService.sln -c Release --no-restore
      - run: dotnet test backend/CloudService.sln -c Release --no-build --collect:"XPlat Code Coverage" --settings backend/coverage.runsettings --logger "trx;LogFileName=backend.trx"
      - name: Upload backend test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/**/TestResults/**/*.trx
            backend/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  integration:
    name: SQL Server Testcontainer integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/CloudService.sln
      - run: dotnet test backend/tests/CloudService.IntegrationTests/CloudService.IntegrationTests.csproj -c Release --no-restore --collect:"XPlat Code Coverage"
        env:
          RUN_INTEGRATION_TESTS: "true"

  frontend:
    name: Next.js lint, typecheck, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
      - working-directory: frontend
        run: npm run build

  docker-and-e2e:
    name: Docker Compose smoke and Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, integration, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build
      - name: Wait for API and frontend readiness
        shell: bash
        run: |
          for i in {1..60}; do
            curl --fail --silent http://localhost:8080/health/ready && curl --fail --silent http://localhost:3000/ && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - working-directory: frontend
        run: npm run e2e
        env:
          CI: "true"
          E2E_EXTERNAL_SERVER: "true"
          RUN_E2E_ADMIN: "true"
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Run deterministic API load smoke test
        uses: grafana/run-k6-action@v1
        with:
          path: scripts/load/k6-orders.js
        env:
          BASE_URL: http://localhost:8080
          K6_PROFILE: ci
          K6_NO_USAGE_REPORT: "true"
      - name: Upload Playwright report and recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn
      - if: always()
        run: docker compose down -v
